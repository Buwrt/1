<body>
<!-- ============================================================
   液态玻璃的位移滤镜。
   ① 必须内联在这一份 HTML 里：Chromium 的 backdrop-filter 只接受
      同文档的 SVG 滤镜引用，外链文件和 data-URI 一律不认；
   ② 但**不能**写 display:none —— 被隐藏的 <defs> 不参与渲染树，
      引用它的那条 backdrop-filter 会整条失效，于是「折射」悄悄退化成
      「一层几乎不糊的半透明面」。所以这里用 0 尺寸 + 绝对定位藏起来，
      它仍然在渲染树里；
   ③ 两档力度：
        #lens       scale=26 —— 「平静水面轻轻晃」，用在固定件（顶栏/底栏/弹层）
        #lens-soft  scale=12 —— 力度减半，用在会跟着滚动的列表卡片上
      （惯性滚动时每帧都要重算一次位移贴图，全用 26 在中低端机上是实打实的掉帧）
   ============================================================ -->
<svg width="0" height="0" style="position:absolute;left:-9999px;top:0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.015" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lens-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.015" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

    <svg viewBox="0 0 16 16" width="72" height="72" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-2.92-.88-2.92-2.9 0-.83.29-1.5.78-2.03-.08-.2-.34-.99.07-2.06 0 0 .63-.2 2.06.78a7.1 7.1 0 0 1 1.87-.25c.64 0 1.28.09 1.87.25 1.43-.98 2.06-.78 2.06-.78.41 1.07.15 1.86.07 2.06.49.53.78 1.2.78 2.03 0 2.03-1.15 2.7-2.93 2.9.3.26.56.76.56 1.54 0 1.11-.01 2.01-.01 2.28 0 .21.15.46.55.38A7.99 7.99 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </div>

</div>

<div id="app" hidden>

  <main id="view" role="main"></main>

  <button class="fab" id="fab" hidden aria-label="新建"></button>

  <!-- 悬浮胶囊底栏：指示器和 tab 同级，靠 DOM 顺序保证它画在按钮下面 -->

    <span class="tab-ind idle" id="tab-ind" aria-hidden="true"></span>
    <button class="tab" data-tab="home"><span class="tab-ico" data-icon="home"></span><span class="tab-label">首页</span></button>
    <button class="tab" data-tab="notifications"><span class="tab-ico" data-icon="bell"></span><span class="tab-label">通知</span><i class="badge" id="tab-badge" hidden></i></button>

    <button class="tab" data-tab="search"><span class="tab-ico" data-icon="search"></span><span class="tab-label">搜索</span></button>
    <button class="tab" data-tab="profile"><span class="tab-ico" data-icon="person"></span><span class="tab-label">我的</span></button>
  </nav>
