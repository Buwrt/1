[package]
name = "githup"
version = "1.2.17"
description = "轻量 GitHub 客户端（桌面版）"
authors = ["Buwrt"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "githup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
