[package]
name = "githup"
version = "1.2.17"
description = "轻量 GitHub 客户端（桌面版）"
authors = ["Buwrt"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "githup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 原生网络通道。
#
# 为什么要它：桌面版一开始让前端直接 fetch GitHub API，结果登录就报
# "Failed to fetch" —— WebView2 里从 http://tauri.localhost 跨域打出去，
# 受 CSP / CORS / 系统代理这一堆东西影响，任何一环不通就整体失败，
# 而在安卓端同样的请求走原生通道从来没出过问题。
#
# 所以跟安卓端对齐：请求交给 Rust 发，发完把结果 eval 回前端。
# 用 native-tls：Windows 上走 schannel（系统自带），不用编 OpenSSL，
# 在 CI 上又快又稳。
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "gzip", "brotli", "deflate"] }

# 局域网同步：与安卓端 LanCrypto 同一套算法（PBKDF2 + AES-256-GCM）。
# 全用纯 Rust 实现，Windows 上不需要编 OpenSSL / 装 NASM。
aes-gcm = { version = "0.10", features = ["std"] }
pbkdf2 = { version = "0.12", features = ["hmac", "sha2"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
