# 构建 githup 桌面版 Windows 安装包（exe）
#
# 为什么必须靠 CI：Tauri 的 Windows 产物只能用 MSVC 工具链编译，
# 而 Linux 上没法交叉编译出 Windows 版（WebView2 的链接库拿不到）。
# GitHub 的 windows-latest 运行器自带 Visual Studio + MSVC + WebView2，
# 是唯一能直接产出 exe 的地方。
#
# 用法：Actions 页面手动点「Run workflow」。
#
# 产物（两种都给）：
#   githup-1.2.17-setup.exe    —— NSIS 安装包，双击装到系统
#   githup-1.2.17-portable.exe —— 单文件绿色版，拷到哪都能跑
name: 构建 Windows 安装包

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

env:
  OWNER: Buwrt
  REPO: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 必须显式装：windows 镜像里的 Python 在 hostedtoolcache 下，
      # 不经过 setup-python 就不会进 PATH，后面用 python 解析 JSON 的步骤
      # 会直接 command not found（第一次跑就栽在这）。
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装 Rust 工具链（带 MSVC 目标）
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译 Tauri 要下几百个 crate，缓存能省下大半时间。
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 打包 NSIS 安装包要用到 makensis。
      # Tauri 找不到时会自己去下载，但那个源经常连不上，这里先用 choco 装好，
      # 装不上也不算失败 —— 单文件 exe 不需要它。
      - name: 准备 NSIS（可选）
        continue-on-error: true
        run: |
          choco install nsis -y --no-progress
          where makensis

      - name: 装 Tauri CLI
        run: npm install
        shell: bash

      # continue-on-error 是故意的：就算打包那一步（NSIS）失手，
      # 前面的编译产物 target/release/githup.exe 也已经生成了，
      # 照样能当绿色版用。失败原因记进日志，由后面的步骤提交上来。
      - name: 构建
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee build-windows.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: 收集产物
        id: collect
        run: |
          mkdir -p dist
          VER=1.2.17
          echo "VER=$VER" >> "$GITHUB_ENV"
          found=0

          # NSIS 安装包（Tauri 命名：产品名_版本_架构-setup.exe）
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] || continue
            cp "$f" "dist/githup-$VER-setup.exe"
            echo "安装包: $(stat -c%s dist/githup-$VER-setup.exe) 字节"
            found=1
          done

          # 单文件绿色版
          if [ -f src-tauri/target/release/githup.exe ]; then
            cp src-tauri/target/release/githup.exe "dist/githup-$VER-portable.exe"
            echo "绿色版: $(stat -c%s dist/githup-$VER-portable.exe) 字节"
            found=1
          fi

          ls -la dist/ || true
          if [ "$found" != "1" ]; then
            echo "::error::没有找到任何 exe，构建没产出"
            exit 1
          fi
        shell: bash

      # 用 curl + jq 而不是 python：windows 的 git-bash 里 python 容易被
      # 解析到微软商店那个占位程序，<stdin> 形式的 heredoc 直接报错退出
      # （前两次跑都栽在这）。jq 是运行器自带的，稳。
      - name: 把 exe 提交进仓库 dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          API=https://api.github.com/repos/Buwrt/1/contents

          # 注意：base64 结果不能走 jq 的 --arg 传。
          # Windows 上命令行总长上限约 32K 字符，把一个 2MB 的 exe 编成
          # base64 塞进 argv 会直接 "Argument list too long"。
          # 所以先落盘成 b64.txt，再用 jq 的 --rawfile 让 jq 自己去读文件。
          put() {   # put <本地文件> <仓库路径>
            local src="$1" dest="$2"
            local sha=""
            base64 -w0 "$src" | tr -d '\n' > b64.txt

            # 已存在的文件要带 sha 才能覆盖
            sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "$API/$dest?ref=main" | jq -r '.sha // empty')

            if [ -n "$sha" ]; then
              jq -n --rawfile c b64.txt --arg m "ci: $dest" --arg s "$sha" \
                 '{message:$m, content:$c, branch:"main", sha:$s}' > body.json
            else
              jq -n --rawfile c b64.txt --arg m "ci: $dest" \
                 '{message:$m, content:$c, branch:"main"}' > body.json
            fi

            echo "提交 $dest ($(stat -c%s "$src") 字节)"
            curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -H "Content-Type: application/json" \
                 --data-binary @body.json "$API/$dest" \
                 | jq -r '"  结果: " + (.content.name // .message)'
          }

          for f in dist/*.exe; do
            [ -f "$f" ] || continue
            put "$f" "dist/$(basename "$f")"
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            put "$f.sha256" "dist/$(basename "$f").sha256"
          done
        shell: bash

      # 附件上传走 uploads.github.com，且必须 curl + --post302：
      #   · 打 api.github.com 的同名路径会直接 404，看不出是域名错
      #   · python urllib 跟 302 时会把 POST 降级成 GET，静默失败
      - name: 挂到 Release v1.2.17
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
          OWNER=Buwrt
          REPO=1
          TAG=v1.2.17
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          RID=$(curl -sS "${AUTH[@]}" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG" \
            | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            RID=$(curl -sS -X POST "${AUTH[@]}" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"githup v1.2.17\",\"draft\":false,\"prerelease\":false}" \
              "https://api.github.com/repos/$OWNER/$REPO/releases" \
              | jq -r '.id')
          fi
          echo "Release id = $RID"

          # 同名旧附件先删，否则报 asset already exists
          for AID in $(curl -sS "${AUTH[@]}" \
              "https://api.github.com/repos/$OWNER/$REPO/releases/$RID/assets?per_page=100" \
              | jq -r '.[] | select(.name | endswith(".exe") or endswith(".exe.sha256")) | .id'); do
            curl -sS -X DELETE "${AUTH[@]}" \
              "https://api.github.com/repos/$OWNER/$REPO/releases/assets/$AID" > /dev/null
            echo "已删除旧附件 $AID"
          done

          for f in dist/*.exe; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "上传 $name ($(stat -c%s "$f") 字节)"
            curl -sS -L --post302 -X POST "${AUTH[@]}" \
              -H "Content-Type: application/vnd.microsoft.portable-executable" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$OWNER/$REPO/releases/$RID/assets?name=$name" \
              | jq -r '"  结果: " + (.name // .message) + " | " + (.size|tostring) + " B"'
          done

          echo "--- 复查 ---"
          curl -sS "${AUTH[@]}" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/$RID/assets?per_page=100" \
            | jq -r '"  附件数: " + (length|tostring), (.[] | "   - " + .name + " " + (.size|tostring) + " B")'
          } 2>&1 | tee upload.log
          RC=${PIPESTATUS[0]}
          grep -q "附件数: 0" upload.log && RC=1
          echo "退出码 = $RC"
          exit $RC
        shell: bash

      # Actions 的日志托管在别的域名上，很多网络环境取不到，
      # 所以把构建日志提交进仓库，随时能翻。
      - name: 回传日志
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          API=https://api.github.com/repos/Buwrt/1/contents
          put() {
            local src="$1" dest="$2"
            local b64 sha=""
            b64=$(base64 -w0 "$src")
            sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "$API/$dest?ref=main" | jq -r '.sha // empty')
            if [ -n "$sha" ]; then
              jq -n --arg c "$b64" --arg s "$sha" \
                 '{message:"ci: 构建日志", content:$c, branch:"main", sha:$s}' > logbody.json
            else
              jq -n --arg c "$b64" \
                 '{message:"ci: 构建日志", content:$c, branch:"main"}' > logbody.json
            fi
            curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -H "Content-Type: application/json" \
                 --data-binary @logbody.json "$API/$dest" \
                 | jq -r '"  已写入 " + (.content.path // .message)'
          }

          # 只留关键行：整份日志几百 KB，没必要全塞进仓库
          grep -nE "error|warning: unused|FAILED|panicked|Finished|Caused by" \
            build-windows.log > ci-grep.txt 2>/dev/null || true
          { echo "=== 关键行 ==="; cat ci-grep.txt; echo; echo "=== 日志尾部 ==="; tail -60 build-windows.log; } > ci/build-windows.log 2>/dev/null || true
          mkdir -p ci
          { echo "=== 关键行 ==="; cat ci-grep.txt; echo; echo "=== 日志尾部 ==="; tail -60 build-windows.log; } > ci/build-windows.log
          put ci/build-windows.log ci/build-windows.log

          if [ -f upload.log ]; then put upload.log ci/upload.log; fi
        shell: bash

