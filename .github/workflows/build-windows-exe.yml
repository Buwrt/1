# 构建 githup 桌面版 Windows 安装包（exe）
#
# 为什么必须靠 CI：Tauri 的 Windows 产物只能用 MSVC 工具链编译，
# 而 Linux 上没法交叉编译出 Windows 版（WebView2 的链接库拿不到）。
# GitHub 的 windows-latest 运行器自带 Visual Studio + MSVC + WebView2，
# 是唯一能直接产出 exe 的地方。
#
# 用法：Actions 页面手动点「Run workflow」。
#
# 产物（两种都给）：
#   githup-1.2.17-setup.exe    —— NSIS 安装包，双击装到系统
#   githup-1.2.17-portable.exe —— 单文件绿色版，拷到哪都能跑
name: 构建 Windows 安装包

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

env:
  OWNER: Buwrt
  REPO: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 必须显式装：windows 镜像里的 Python 在 hostedtoolcache 下，
      # 不经过 setup-python 就不会进 PATH，后面用 python 解析 JSON 的步骤
      # 会直接 command not found（第一次跑就栽在这）。
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装 Rust 工具链（带 MSVC 目标）
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译 Tauri 要下几百个 crate，缓存能省下大半时间。
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 打包 NSIS 安装包要用到 makensis。
      # Tauri 找不到时会自己去下载，但那个源经常连不上，这里先用 choco 装好，
      # 装不上也不算失败 —— 单文件 exe 不需要它。
      - name: 准备 NSIS（可选）
        continue-on-error: true
        run: |
          choco install nsis -y --no-progress
          where makensis

      - name: 装 Tauri CLI
        run: npm install
        shell: bash

      # continue-on-error 是故意的：就算打包那一步（NSIS）失手，
      # 前面的编译产物 target/release/githup.exe 也已经生成了，
      # 照样能当绿色版用。失败原因记进日志，由后面的步骤提交上来。
      - name: 构建
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee build-windows.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: 收集产物
        id: collect
        run: |
          mkdir -p dist
          VER=1.2.17
          echo "VER=$VER" >> "$GITHUB_ENV"
          found=0

          # NSIS 安装包（Tauri 命名：产品名_版本_架构-setup.exe）
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] || continue
            cp "$f" "dist/githup-$VER-setup.exe"
            echo "安装包: $(stat -c%s dist/githup-$VER-setup.exe) 字节"
            found=1
          done

          # 单文件绿色版
          if [ -f src-tauri/target/release/githup.exe ]; then
            cp src-tauri/target/release/githup.exe "dist/githup-$VER-portable.exe"
            echo "绿色版: $(stat -c%s dist/githup-$VER-portable.exe) 字节"
            found=1
          fi

          ls -la dist/ || true
          if [ "$found" != "1" ]; then
            echo "::error::没有找到任何 exe，构建没产出"
            exit 1
          fi
        shell: bash

      - name: 把 exe 提交进仓库 dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import base64, glob, hashlib, json, os, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = "Buwrt", "1", "main"
          API = "https://api.github.com"

          def api_put(path, data, msg):
              body = {"message": msg, "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              # 已存在的文件必须带 sha 才能覆盖
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "ci-exe"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      body["sha"] = json.loads(z.read().decode()).get("sha")
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ci-exe"})
              with urllib.request.urlopen(req, timeout=600) as z:
                  print("已提交", path, len(data), "字节")

          for p in sorted(glob.glob("dist/*.exe")):
              data = open(p, "rb").read()
              name = os.path.basename(p)
              api_put(f"dist/{name}", data, f"ci: {name}")
              api_put(f"dist/{name}.sha256",
                      (hashlib.sha256(data).hexdigest() + "\n").encode(),
                      f"ci: {name} sha256")
          PYEOF
        shell: bash

      # 附件上传走 uploads.github.com，且必须 curl + --post302：
      #   · 打 api.github.com 的同名路径会直接 404，看不出是域名错
      #   · python urllib 跟 302 时会把 POST 降级成 GET，静默失败
      - name: 挂到 Release v1.2.17
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
          OWNER=Buwrt
          REPO=1
          TAG=v1.2.17
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          RID=$(curl -sS "${AUTH[@]}" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))")
          if [ -z "$RID" ]; then
            RID=$(curl -sS -X POST "${AUTH[@]}" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"githup v1.2.17\",\"draft\":false,\"prerelease\":false}" \
              "https://api.github.com/repos/$OWNER/$REPO/releases" \
              | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi
          echo "Release id = $RID"

          # 同名旧附件先删，否则报 asset already exists
          for AID in $(curl -sS "${AUTH[@]}" \
              "https://api.github.com/repos/$OWNER/$REPO/releases/$RID/assets?per_page=100" \
              | python -c "
          import json,sys
          for a in json.load(sys.stdin):
              if a['name'].endswith('.exe') or a['name'].endswith('.exe.sha256'):
                  print(a['id'])
          "); do
            curl -sS -X DELETE "${AUTH[@]}" \
              "https://api.github.com/repos/$OWNER/$REPO/releases/assets/$AID" > /dev/null
            echo "已删除旧附件 $AID"
          done

          for f in dist/*.exe; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "上传 $name ($(stat -c%s "$f") 字节)"
            curl -sS -L --post302 -X POST "${AUTH[@]}" \
              -H "Content-Type: application/vnd.microsoft.portable-executable" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$OWNER/$REPO/releases/$RID/assets?name=$name" \
              | python -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              print('  结果:', d.get('name') or d.get('message'), '|', d.get('size'), 'B')
          except Exception as e:
              print('  解析失败', e)
          "
          done

          echo "--- 复查 ---"
          curl -sS "${AUTH[@]}" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/$RID/assets?per_page=100" \
            | python -c "
          import json,sys
          xs=json.load(sys.stdin)
          print('  附件数:', len(xs))
          for a in xs: print('   -', a['name'], a['size'], 'B')
          "
          } 2>&1 | tee upload.log
          RC=${PIPESTATUS[0]}
          grep -q "附件数: 0" upload.log && RC=1
          echo "退出码 = $RC"
          exit $RC
        shell: bash

      # Actions 的日志托管在别的域名上，很多网络环境取不到，
      # 所以把构建日志提交进仓库，随时能翻。
      - name: 回传日志
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import base64, json, os, re, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = "Buwrt", "1", "main"
          API = "https://api.github.com"

          def api_put(path, data):
              body = {"message": "ci: 构建日志", "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "ci-log"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      body["sha"] = json.loads(z.read().decode()).get("sha")
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ci-log"})
              with urllib.request.urlopen(req, timeout=300) as z:
                  print("已写入", path, len(data))

          try:
              log = open("build-windows.log", encoding="utf-8", errors="replace").read()
          except Exception as e:
              log = "读不到 build-windows.log: %s" % e

          lines = log.split("\n")
          marks = set()
          for i, s in enumerate(lines):
              if re.search(r'error(\[|:|\s)|warning: unused|FAILED|panicked|错误', s, re.I):
                  for k in range(max(0, i - 3), min(len(lines), i + 4)):
                      marks.add(k)
          out, last = [], -2
          for k in sorted(marks):
              if k != last + 1:
                  out.append("......")
              out.append(lines[k])
              last = k
          body = "\n".join(out) if out else log[-12000:]
          api_put("ci/build-windows.log", body[:20000].encode())

          try:
              api_put("ci/upload.log", open("upload.log", encoding="utf-8",
                      errors="replace").read()[:20000].encode())
          except Exception as e:
              print("upload.log 跳过:", e)
          PYEOF
        shell: bash
