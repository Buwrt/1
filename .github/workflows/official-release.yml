# 用官方密钥打包正式版 Release APK（githup 库）
#
# 与 build-release-apk.yml 的区别：那份用 CI 临时生成的自洽密钥，
# 这份用**官方密钥**（以加密 Secret 形式在构建时还原），签出来的包
# 证书指纹 = 863dd1cd…927，与 SignCheck.EXPECTED_SHA256 一致，
# 装上不会弹「不是官方版本」。
#
# 有防护链（Guard / GuardKeys / BlockedActivity），所以除了签名，
# 还必须跑 tools/gen-guard.py 按同一份官方密钥重算链常量 ——
# 否则「签名指纹 ↔ GuardKeys」对不上，第 1 环就会把包拦进 BlockedActivity。
#
# 密钥不进仓库：用完随 runner 销毁。
name: Official Release APK (githup)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: Buwrt
      REPO: githup
      BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore official keystore
        run: |
          set -e
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/githup-release.jks
          printf '%s' "$KEYSTORE_PASS" > keystore/pass.txt
          # 只确认文件到位与别名正确，绝不打印密钥内容
          ls -la keystore/
          keytool -list -keystore keystore/githup-release.jks \
                  -storepass "$KEYSTORE_PASS" -alias githup | head -3
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Print version (must be 1.2.16 / 1002016)
        run: |
          echo "--- version.lock ---"
          grep -E "^version=|^versionCode=" version.lock || true
          echo "--- build.gradle ---"
          grep -E "versionName|versionCode" app/build.gradle | head -4
          echo "--- app name ---"
          grep -E "app_name" app/src/main/res/values/strings.xml || true

      - name: Regenerate guard chain constants with official key
        run: |
          set -e
          python3 tools/gen-guard.py .
          echo "--- GuardKeys 片段 ---"
          grep -E "CERT_SHA256|VERSION_NAME|VERSION_CODE|APP_LABEL" \
            app/src/main/java/com/hubmobile/app/GuardKeys.java || true
          echo "--- assets.sha 条目数 ---"
          wc -l app/src/main/assets/guard/assets.sha
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Build Release APK
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # 构建失败时必须让这条运行**变红**。
      #
      # 以前 Build 步骤挂了 continue-on-error: true，为的是仍能提交日志；
      # 但代价是 gradlew 失败时整个 job 依然是绿色对勾 —— 用户看到
      # 「打包成功」，点进去却一个 APK 都没有（实测 37 次里有 8 次这样）。
      #
      # 所以这里补一道硬断言：APK 不在、或者小得离谱，就直接 exit 1。
      # 绿色从此只代表一件事 —— 确实产出了 APK。
      - name: Assert APK produced
        id: assert
        env:
          BUILD_EXIT: ${{ steps.b.outputs.exit }}
        run: |
          set -e
          if [ "$BUILD_EXIT" != "0" ]; then
            echo "::error::构建失败（gradlew 退出码 $BUILD_EXIT）"
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::构建报成功，但 app/build/outputs/apk/release/ 下没有 APK"
            ls -R app/build/outputs/apk 2>/dev/null || true
            exit 1
          fi
          SZ=$(stat -c%s "$APK")
          echo "APK: $APK（$SZ 字节）"
          # 正式包不可能小于 300KB，小了说明产物是残缺的
          if [ "$SZ" -lt 300000 ]; then
            echo "::error::APK 大小异常（$SZ 字节），疑似残缺产物"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$SZ" >> "$GITHUB_OUTPUT"

      # 把产物信息写进 Summary：点开这条运行一眼就能看到大小和 sha256，
      # 不用翻日志。
      - name: Write APK summary
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          {
            echo "### 官方签名 APK"
            echo ""
            echo "- 文件：$(basename "$APK")"
            echo "- 大小：$(stat -c%s "$APK") 字节"
            echo "- sha256：$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "- 证书指纹：863dd1cd3752e59165e152bc4ab35fde478fcd296d724a6bc58cec0368184927"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report cert fingerprint
        if: steps.b.outputs.exit == '0'
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK ($(stat -c%s "$APK") 字节)"
          keytool -exportcert -keystore keystore/githup-release.jks \
                  -storepass "$KEYSTORE_PASS" -alias githup -rfc \
            | openssl x509 -noout -fingerprint -sha256
          echo "--- aapt 版本信息 ---"
          $ANDROID_HOME/build-tools/*/aapt dump badging "$APK" 2>/dev/null \
            | grep -E "package:|application-label" || true
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      # 产物叫 app-release.apk，发布出去的附件必须叫 githup-v1.2.16.apk：
      # App 内更新检测是按这个名字拼 Release 直链的，对不上就 404。
      - name: Rename APK to release name
        run: |
          set -e
          VER=$(grep -E '^version=' version.lock | cut -d= -f2 | tr -d '\r')
          echo "version.lock 版本: $VER"
          mkdir -p apk
          SRC=app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || { echo "找不到构建产物"; ls -la app/build/outputs/apk/release/ || true; exit 1; }
          cp "$SRC" "apk/githup-v$VER.apk"
          sha256sum "apk/githup-v$VER.apk" | awk '{print $1}' > "apk/githup-v$VER.apk.sha256"
          ls -la apk/

      # 失败时也要把 build.log 交上来：gradle 的报错只在日志里，
      # 读不到日志就只能靠猜（Assert 那一步的红叉本身不告诉你是哪一行炸的）。
      - name: Commit log and APK via API
        if: always()
        run: |
          python3 - <<'PYEOF'
          import base64, glob, hashlib, json, os, shutil, urllib.error, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER = os.environ["OWNER"]; REPO = os.environ["REPO"]; BRANCH = os.environ["BRANCH"]
          API = "https://api.github.com"

          def api_put(path, data, msg):
              body = {"message": msg, "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json", "User-Agent": "ci"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      sha = json.loads(z.read().decode()).get("sha")
                  if sha:
                      body["sha"] = sha
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json", "User-Agent": "ci"})
              try:
                  with urllib.request.urlopen(req, timeout=240) as z:
                      print("uploaded", path, len(data))
              except urllib.error.HTTPError as e:
                  print("FAILED", path, e.code, e.read().decode()[:200])

          try:
              log = open("build.log", "rb").read()
              api_put("ci/build-official.log", b"\n".join(log.split(b"\n")[-400:]),
                      "ci: 官方密钥构建日志")
          except Exception as e:
              print("log skip", e)

          apks = glob.glob("apk/*.apk")
          print("found:", apks)
          for p in apks:
              d = open(p, "rb").read()
              name = os.path.basename(p)
              api_put(f"apk/{name}", d, f"ci: 官方签名 APK {name}")
              api_put(f"apk/{name}.sha256",
                      (hashlib.sha256(d).hexdigest() + "\n").encode(),
                      f"ci: {name} sha256")

          shutil.rmtree("keystore", ignore_errors=True)
          PYEOF

      # if-no-files-found 从 warn 改成 error：
      # 以前匹配不到文件时只是警告一声，步骤照样绿，于是又出现
      # 「看着成功、下面没 APK」。现在匹配不到就红。
      # retention-days 显式写 90，不依赖仓库默认值（默认值是可以被改的）。
      - name: Upload artifact
        if: steps.b.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: githup-official-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
