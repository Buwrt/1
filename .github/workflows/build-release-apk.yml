# 云端构建 Release APK 并回传仓库
#
# 两个前提问题在本工作流里解决：
#   1) 官方签名密钥 keystore/ 被 .gitignore 排除、不在仓库里 —— 这里临时生成
#      一份自洽的密钥（PKCS12），并用 tools/gen-guard.py 按同一份密钥重算
#      防护链常量，保证「签名指纹 ↔ GuardKeys」互相吻合，装上去不会被第 1 环拦。
#   2) 构建日志与产物写不回仓库 —— 走 REST API 直接写，不依赖 git add
#      （.gitignore 里 *.apk / apk/ 被排除）。
name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: Buwrt
      REPO: 1
      BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Create signing keystore
        run: |
          set -e
          mkdir -p keystore
          printf '%s' 'android' > keystore/pass.txt
          rm -f keystore/githup-release.jks
          keytool -genkeypair -v \
            -keystore keystore/githup-release.jks \
            -alias githup \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=githup, OU=githup, O=githup, L=Xian, ST=Shaanxi, C=CN"
          ls -la keystore/
          keytool -list -keystore keystore/githup-release.jks -storepass android

      - name: Regenerate guard chain constants
        run: |
          set -e
          python3 tools/gen-guard.py .
          echo "--- GuardKeys 片段 ---"
          grep -E "CERT_SHA256|VERSION_NAME|VERSION_CODE" app/src/main/java/com/hubmobile/app/GuardKeys.java || true
          echo "--- assets.sha 条目数 ---"
          wc -l app/src/main/assets/guard/assets.sha

      - name: Sync cert fingerprint into SignCheck
        run: |
          set -e
          python3 - <<'PYEOF'
          import re

          GUARD = 'app/src/main/java/com/hubmobile/app/GuardKeys.java'
          SIGN = 'app/src/main/java/com/hubmobile/app/SignCheck.java'

          # gen-guard.py 已把新证书指纹写进 GuardKeys.CERT_SHA256（防护链第 1 环用）。
          # 但 SignCheck.EXPECTED_SHA256 是硬编码的官方指纹，gen-guard 不会碰它 ——
          # 弹「不是官方版本」的就是它。这里把两处同步成同一枚指纹。
          g = open(GUARD, encoding='utf-8').read()
          m = re.search(r'CERT_SHA256\s*=\s*"([0-9a-f]{64})"', g)
          if not m:
              raise SystemExit('GuardKeys 里取不到 CERT_SHA256')
          fp = m.group(1)
          print('新证书指纹:', fp)

          s = open(SIGN, encoding='utf-8').read()
          old = re.search(r'([0-9a-f]{64})', s)
          print('原 SignCheck 指纹:', old.group(1) if old else '(无)')
          new = re.sub(r'[0-9a-f]{64}', fp, s)
          open(SIGN, 'w', encoding='utf-8').write(new)

          # 复核：两处必须完全一致，否则 Guard 过了 SignCheck 还会拦
          g2 = re.search(r'CERT_SHA256\s*=\s*"([0-9a-f]{64})"',
                         open(GUARD, encoding='utf-8').read()).group(1)
          s2 = re.search(r'([0-9a-f]{64})', open(SIGN, encoding='utf-8').read()).group(1)
          print('GuardKeys =', g2)
          print('SignCheck =', s2)
          if g2 != s2:
              raise SystemExit('指纹未对齐')
          print('OK 指纹已对齐')
          PYEOF

      - name: Build Release APK
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit log and APK via API
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request, urllib.error, urllib.parse

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = os.environ["OWNER"], os.environ["REPO"], os.environ["BRANCH"]
          API = "https://api.github.com"


          def api_put(path, content_bytes, msg):
              body = {
                  "message": msg,
                  "branch": BRANCH,
                  "content": base64.b64encode(content_bytes).decode(),
              }
              # 已存在的文件要带 sha 才能覆盖
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "ci-upload"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      body["sha"] = json.loads(z.read().decode()).get("sha")
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(),
                  method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ci-upload"})
              try:
                  with urllib.request.urlopen(req, timeout=180) as z:
                      print("uploaded", path, len(content_bytes))
              except urllib.error.HTTPError as e:
                  print("FAILED", path, e.code, e.read().decode()[:300])


          # 1) 构建日志（尾部 400 行）
          try:
              log = open("build.log", "rb").read()
              tail = b"\n".join(log.split(b"\n")[-400:])
              api_put("ci/build-release.log", tail, "ci: Release 构建日志")
          except Exception as e:
              print("log skip", e)

          # 2) APK + sha256
          import glob
          apks = glob.glob("app/build/outputs/apk/release/*.apk")
          print("found apks:", apks)
          for p in apks:
              data = open(p, "rb").read()
              name = os.path.basename(p)
              api_put(f"apk/{name}", data, f"ci: Release APK {name}")
              import hashlib
              api_put(f"apk/{name}.sha256",
                      (hashlib.sha256(data).hexdigest() + "\n").encode(),
                      f"ci: {name} sha256")
          if not apks:
              print("NO APK FOUND")
          PYEOF

      - name: Upload artifact
        if: steps.b.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: githup-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
