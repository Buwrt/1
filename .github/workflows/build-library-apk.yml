# 打包「应用库」版 APK
#
# 思路：源码主体取自本仓库的 githup-source.zip（随源码一起上传）。
# 不再 clone Buwrt/githup —— 保证「改了什么就打什么」。
#
# 两件事必须按顺序做对，否则装上去会被自己拦下：
#   1. gen-srcfingerprint.py 改写 api.js 的 SRC_SHA256
#   2. gen-guard.py 在此之后生成 assets.sha（防护链第 3 环校验前端文件哈希）
#   3. 最后才 gradlew
# 顺序反了，清单里烙的就是改写前的 api.js，第 3 环当场不通过。
#
# 密钥不进仓库：以加密 Secret 形式在构建时还原，用完随 runner 销毁。
# 签出来的证书指纹 = 863dd1cd…4927，与 SignCheck.EXPECTED_SHA256 一致，
# 可以直接覆盖安装官方版。

name: Build Library APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout 补丁仓库
        uses: actions/checkout@v4
        with:
          path: patchrepo

      # 源码取自**本仓库**的 githup-source.zip，不再 clone Buwrt/githup。
      # 这样改哪个库就打哪个库的包，不会出现「改了本地但流水线 clone 的是旧远端」
      # —— 之前踩过：本地改完以为进了包，实际流水线抓的是远端的老代码。
      - name: 取 githup 源码（本仓库源码包）
        run: |
          set -e
          mkdir -p src
          unzip -q patchrepo/githup-source.zip -d src
          if [ -d src/githup ]; then
            mv src/githup/.[!.]* src/ 2>/dev/null || true
            mv src/githup/* src/ 2>/dev/null || true
            rmdir src/githup 2>/dev/null || true
          fi
          cd src
          echo "--- version.lock ---"
          grep -E "^version=|^versionCode=" version.lock
          echo "--- 关键改动自检 ---"
          grep -c "secondary rate limit" app/src/main/assets/web/js/page-repo.js || true
          ls app/src/main/java/com/hubmobile/app/UploadService.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 还原官方签名密钥
        run: |
          set -e
          mkdir -p src/keystore
          echo "$KEYSTORE_B64" | base64 -d > src/keystore/githup-release.jks
          printf '%s' "$KEYSTORE_PASS" > src/keystore/pass.txt
          ls -la src/keystore/
          # 只确认文件到位与别名正确，绝不打印密钥内容
          keytool -list -keystore src/keystore/githup-release.jks \
                  -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" | head -3
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      # 补丁步骤已移除：应用库 / 数据概览的改动已直接合进 Buwrt/githup，
      # 这里 clone 下来的就是改好的源码。再打一遍补丁会命中不到锚点而失败。

      # 内置默认令牌（免登录）。
      #
      # 令牌值**不进仓库**：GitHub Secret Scanning 会扫公开仓库里的 ghp_
      # 明文并自动吊销它。仓库里只留机制（embedded-token.js 为空、另有
      # .example 模板），真实值由加密 Secret 在构建时注入。
      #
      # 必须排在 gen-srcfingerprint 之前 —— 指纹会把这个文件算进去，
      # 晚写了就和包里的文件对不上，第 3 环校验当场拦下。
      - name: 注入内置默认令牌
        run: |
          set -e
          cd src
          F=app/src/main/assets/web/js/embedded-token.js
          if [ -z "$EMBEDDED_TOKEN" ]; then
            echo "未配置 EMBEDDED_TOKEN，保持留空（需要登录）"
            exit 0
          fi
          printf '%s\n' "/* 内置默认令牌 —— 构建时注入，不进版本库。 */" > "$F"
          printf "window.EMBEDDED_TOKEN = '%s';\n" "$EMBEDDED_TOKEN" >> "$F"
          echo "已注入内置令牌（长度 ${#EMBEDDED_TOKEN}）"
        env:
          EMBEDDED_TOKEN: ${{ secrets.EMBEDDED_TOKEN }}

      - name: 生成源码指纹与防护链常量（顺序不能反）
        run: |
          set -e
          cd src
          python3 tools/gen-srcfingerprint.py .
          python3 tools/gen-guard.py .
          echo "--- GuardKeys 片段 ---"
          grep -E "CERT_SHA256|VERSION_NAME|VERSION_CODE" \
            app/src/main/java/com/hubmobile/app/GuardKeys.java || true
          echo "--- assets.sha 条目数 ---"
          wc -l app/src/main/assets/guard/assets.sha

      - name: Build Release APK
        id: b
        continue-on-error: true
        run: |
          cd src
          chmod +x ./gradlew
          # 不能 set -o pipefail 配默认 bash -e：gradle 一失败整条管道非零，
          # 脚本当场退出，下面那句 echo 就写不进 GITHUB_OUTPUT，
          # Assert 拿到空值只能报一个说不清的错。
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "gradle exit=$code"

      # 硬断言：APK 不在或太小就直接变红。
      # 官方那条流水线踩过 —— continue-on-error 下 gradle 失败仍是绿色对勾，
      # 用户看到「打包成功」点进去却一个 APK 都没有。
      - name: Assert APK produced
        id: assert
        run: |
          set -e
          if [ "${{ steps.b.outputs.exit }}" != "0" ]; then
            echo "::error::构建失败（gradlew 退出码 ${{ steps.b.outputs.exit }}）"
            exit 1
          fi
          APK=$(ls src/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::构建报成功，但 release 目录下没有 APK"
            ls -R src/app/build/outputs/apk 2>/dev/null || true
            exit 1
          fi
          SZ=$(stat -c%s "$APK")
          echo "APK: $APK（$SZ 字节）"
          if [ "$SZ" -lt 300000 ]; then
            echo "::error::APK 大小异常（$SZ 字节），疑似残缺产物"
            exit 1
          fi

      - name: 重命名并清理密钥
        run: |
          set -e
          VER=$(grep -E '^version=' src/version.lock | cut -d= -f2 | tr -d '\r')
          mkdir -p out
          cp src/app/build/outputs/apk/release/app-release.apk "out/githup-v$VER.apk"
          sha256sum "out/githup-v$VER.apk" | awk '{print $1}' > "out/githup-v$VER.apk.sha256"
          # 密钥用完即毁，别留在 workspace 里被后续步骤打包上传
          rm -rf src/keystore
          ls -la out/

      - name: 证书指纹核对
        run: |
          set -e
          mkdir -p /tmp/ks
          echo "$KEYSTORE_B64" | base64 -d > /tmp/ks/k.jks
          keytool -exportcert -keystore /tmp/ks/k.jks \
                  -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" -rfc \
            | openssl x509 -noout -fingerprint -sha256
          rm -rf /tmp/ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      # 除了 artifact，再往仓库里放一份：artifact 存在 Azure Blob 上，
      # 有些网络环境取不到，仓库里的这份永远能拿到。
      - name: 提交 APK 到仓库
        if: steps.b.outputs.exit == '0'
        run: |
          set -e
          python3 - <<'PYEOF'
          import base64, glob, hashlib, json, os, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = "Buwrt", "1", "main"
          API = "https://api.github.com"

          def put(path, data, msg):
              body = {"message": msg, "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json", "User-Agent": "ci"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      sha = json.loads(z.read().decode()).get("sha")
                  if sha:
                      body["sha"] = sha
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json", "User-Agent": "ci"})
              with urllib.request.urlopen(req, timeout=240) as z:
                  print("uploaded", path, len(data), "bytes")

          for p in sorted(glob.glob("out/*")):
              put(p, open(p, "rb").read(), "ci: 应用库版 APK " + os.path.basename(p))
          PYEOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: githup-library-apk
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: 上传构建日志（失败时也有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
          if-no-files-found: warn
          retention-days: 30

      # artifact 落在 Azure Blob 上，有些网络环境取不到；
      # 构建失败时尤其需要日志，所以再往仓库里放一份。
      - name: 提交构建日志到仓库
        if: always()
        run: |
          set -e
          python3 - <<'PYEOF'
          import base64, json, os, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = "Buwrt", "1", "main"
          API = "https://api.github.com"

          try:
              raw = open("src/build.log", "rb").read()
          except Exception as e:
              print("no build.log:", e)
              raise SystemExit(0)
          # 只留最后 400 行：gradle 的报错在末尾，前面是依赖下载噪音
          lines = raw.split(b"\n")[-400:]
          data = b"\n".join(lines)

          path = "ci/build.log"
          body = {"message": "ci: 构建日志", "branch": BRANCH,
                  "content": base64.b64encode(data).decode()}
          try:
              r = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json", "User-Agent": "ci"})
              with urllib.request.urlopen(r, timeout=60) as z:
                  sha = json.loads(z.read().decode()).get("sha")
              if sha:
                  body["sha"] = sha
          except Exception:
              pass
          req = urllib.request.Request(
              f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
              data=json.dumps(body).encode(), method="PUT",
              headers={"Authorization": "Bearer " + TOKEN,
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json", "User-Agent": "ci"})
          with urllib.request.urlopen(req, timeout=240) as z:
              print("uploaded build.log", len(data))
          PYEOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
