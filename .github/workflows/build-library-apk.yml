# 打包「应用库」版 APK
#
# 思路：本仓库（Buwrt/1）**只放补丁**，源码主体从公开的 Buwrt/githup
# 现取现打 —— 省掉把整个工程搬过来的麻烦，也让补丁本身看得清清楚楚。
#
# 两件事必须按顺序做对，否则装上去会被自己拦下：
#   1. gen-srcfingerprint.py 改写 api.js 的 SRC_SHA256
#   2. gen-guard.py 在此之后生成 assets.sha（防护链第 3 环校验前端文件哈希）
#   3. 最后才 gradlew
# 顺序反了，清单里烙的就是改写前的 api.js，第 3 环当场不通过。
#
# 密钥不进仓库：以加密 Secret 形式在构建时还原，用完随 runner 销毁。
# 签出来的证书指纹 = 863dd1cd…4927，与 SignCheck.EXPECTED_SHA256 一致，
# 可以直接覆盖安装官方版。

name: Build Library APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout 补丁仓库
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: 取 githup 源码（公开库，无需令牌）
        run: |
          set -e
          git clone --depth 1 https://github.com/Buwrt/githup.git src
          cd src
          echo "--- version.lock ---"
          grep -E "^version=|^versionCode=" version.lock

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 还原官方签名密钥
        run: |
          set -e
          mkdir -p src/keystore
          echo "$KEYSTORE_B64" | base64 -d > src/keystore/githup-release.jks
          printf '%s' "$KEYSTORE_PASS" > src/keystore/pass.txt
          ls -la src/keystore/
          # 只确认文件到位与别名正确，绝不打印密钥内容
          keytool -list -keystore src/keystore/githup-release.jks \
                  -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" | head -3
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: 应用应用库补丁
        run: |
          set -e
          python3 patchrepo/apply-patch.py src patchrepo

      - name: 生成源码指纹与防护链常量（顺序不能反）
        run: |
          set -e
          cd src
          python3 tools/gen-srcfingerprint.py .
          python3 tools/gen-guard.py .
          echo "--- GuardKeys 片段 ---"
          grep -E "CERT_SHA256|VERSION_NAME|VERSION_CODE" \
            app/src/main/java/com/hubmobile/app/GuardKeys.java || true
          echo "--- assets.sha 条目数 ---"
          wc -l app/src/main/assets/guard/assets.sha

      - name: Build Release APK
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          cd src
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # 硬断言：APK 不在或太小就直接变红。
      # 官方那条流水线踩过 —— continue-on-error 下 gradle 失败仍是绿色对勾，
      # 用户看到「打包成功」点进去却一个 APK 都没有。
      - name: Assert APK produced
        id: assert
        run: |
          set -e
          if [ "${{ steps.b.outputs.exit }}" != "0" ]; then
            echo "::error::构建失败（gradlew 退出码 ${{ steps.b.outputs.exit }}）"
            exit 1
          fi
          APK=$(ls src/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::构建报成功，但 release 目录下没有 APK"
            ls -R src/app/build/outputs/apk 2>/dev/null || true
            exit 1
          fi
          SZ=$(stat -c%s "$APK")
          echo "APK: $APK（$SZ 字节）"
          if [ "$SZ" -lt 300000 ]; then
            echo "::error::APK 大小异常（$SZ 字节），疑似残缺产物"
            exit 1
          fi

      - name: 重命名并清理密钥
        run: |
          set -e
          VER=$(grep -E '^version=' src/version.lock | cut -d= -f2 | tr -d '\r')
          mkdir -p out
          cp src/app/build/outputs/apk/release/app-release.apk "out/githup-v$VER.apk"
          sha256sum "out/githup-v$VER.apk" | awk '{print $1}' > "out/githup-v$VER.apk.sha256"
          # 密钥用完即毁，别留在 workspace 里被后续步骤打包上传
          rm -rf src/keystore
          ls -la out/

      - name: 证书指纹核对
        run: |
          set -e
          mkdir -p /tmp/ks
          echo "$KEYSTORE_B64" | base64 -d > /tmp/ks/k.jks
          keytool -exportcert -keystore /tmp/ks/k.jks \
                  -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" -rfc \
            | openssl x509 -noout -fingerprint -sha256
          rm -rf /tmp/ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: githup-library-apk
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: 上传构建日志（失败时也有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
          if-no-files-found: warn
          retention-days: 30
