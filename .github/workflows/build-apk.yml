name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          ls "$ANDROID_HOME" || true
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "none"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "none"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "installing platform 34 + build-tools"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.2/bin/gradle
          /opt/gradle-8.2/bin/gradle --version | head -6

      - name: Build Debug APK
        run: |
          /opt/gradle-8.2/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
