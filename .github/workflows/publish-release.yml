# 打 tag 或手动触发时，自动把 apk/ 下的安装包发布为 Release 附件。
#
# 走这条路的理由：发布 Release 需要仓库写权限，而外部令牌往往拿不到；
# 仓库自己的 GITHUB_TOKEN 天然有这个权限，由 Actions 代为完成最省事。
name: 发布 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # RELEASE_NOTES.md 是**累积**的：每个版本一节，新的加在最上面，历史留着备查。
      # 而 Release 页面的正文必须是「这一个版本」的内容 —— 直接把整个文件当 body
      # 贴上去，v1.1.4 的 Release 里就会跟着 1.1.3、1.1.2 一整串旧记录，
      # 用户翻半天以为版本发错了。所以发布前先抽出当前版本那一节。
      - name: 抽出当前版本的发布说明
        run: |
          # 打 tag 时用 tag 里的版本号；手动触发时 GITHUB_REF_NAME 是分支名，
          # 取不到对应小节，就退回「文件里最上面那一节」—— 同样是最新版。
          python3 tools/extract-release-notes.py \
              RELEASE_NOTES.md "${GITHUB_REF_NAME#v}" > /tmp/release-body.md \
            || python3 tools/extract-release-notes.py \
              RELEASE_NOTES.md > /tmp/release-body.md
          echo "--- 正文首行 ---"
          head -1 /tmp/release-body.md
          echo "--- 小节数（应为 1）---"
          grep -c '^## ' /tmp/release-body.md || true

      - name: 发布 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body_path: /tmp/release-body.md
          name: githup ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
