# 打 tag 或手动触发时，自动把 apk/ 下的安装包发布为 Release 附件。
#
# 走这条路的理由：发布 Release 需要仓库写权限，而外部令牌往往拿不到；
# 仓库自己的 GITHUB_TOKEN 天然有这个权限，由 Actions 代为完成最省事。
#
# ⚠️ 本文件与 githup-release 库的同名文件「故意不同」：这里多一步
#    「回写指纹」，因为只有本库发安装包。同步两库代码时别把它覆盖掉。
name: 发布 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # RELEASE_NOTES.md 是**累积**的：每个版本一节，新的加在最上面，历史留着备查。
      # 而 Release 页面的正文必须是「这一个版本」的内容 —— 直接把整个文件当 body
      # 贴上去，v1.1.4 的 Release 里就会跟着 1.1.3、1.1.2 一整串旧记录，
      # 用户翻半天以为版本发错了。所以发布前先抽出当前版本那一节。
      - name: 抽出当前版本的发布说明
        run: |
          # 打 tag 时用 tag 里的版本号；手动触发时 GITHUB_REF_NAME 是分支名，
          # 取不到对应小节，就退回「文件里最上面那一节」—— 同样是最新版。
          python3 tools/extract-release-notes.py \
              RELEASE_NOTES.md "${GITHUB_REF_NAME#v}" > /tmp/release-body.md \
            || python3 tools/extract-release-notes.py \
              RELEASE_NOTES.md > /tmp/release-body.md
          echo "--- 正文首行 ---"
          head -1 /tmp/release-body.md
          echo "--- 小节数（应为 1）---"
          grep -c '^## ' /tmp/release-body.md || true

      # 重新发布同一个版本时（包换了、版本号没换），Release 里已经有一个同名附件。
      # 同名附件传不上去会让这一步失败，所以先按名字把旧的删掉再传 ——
      # 保证 Release 里那个包就是本次构建出来的这一个。
      - name: 清掉同名旧附件
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          release=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}")
          for f in apk/*.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            ids=$(echo "$release" | WANT="$name" python3 -c "
          import json, sys, os
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          want = os.environ['WANT']
          print(' '.join(str(a['id']) for a in d.get('assets', []) if a['name'] == want))
          ")
            for id in $ids; do
              echo "删除旧附件 $name（id=$id）"
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id"
            done
          done

      - name: 发布 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body_path: /tmp/release-body.md
          name: githup ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布完成后，用附件的真实大小 / SHA-256 回写 version.json 与
      # RELEASE_NOTES.md 的「校验」段，并提交。
      # 为什么要自动化：更新弹窗拿 version.json 当安装包指纹，App 内的
      # Release 详情展示的是 RELEASE_NOTES.md —— 以前靠发版时手动改，
      # 一旦忘了改，重发布的包就会被判成「校验和不一致（可能被篡改）」
      # 拦下来，好包装不上。GITHUB_TOKEN 的提交默认不会再触发 workflow，
      # 不存在递归。
      - name: 用附件真实指纹回写 version.json 与 RELEASE_NOTES.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import datetime, glob, hashlib, json, os, re
          apks = sorted(glob.glob('apk/*.apk'))
          if not apks:
              raise SystemExit('apk/ 下没有安装包')
          path = apks[0]
          data = open(path, 'rb').read()
          sha = hashlib.sha256(data).hexdigest()
          tag = os.environ.get('GITHUB_REF_NAME', '')
          ver = tag.lstrip('v')
          m = json.load(open('version.json', encoding='utf-8'))
          m['version'] = ver
          m['name'] = 'githup v' + ver
          m['apk'] = ('https://github.com/Buwrt/githup/releases/download/'
                      + tag + '/' + os.path.basename(path))
          m['size'] = len(data)
          m['sha256'] = sha
          m['published'] = datetime.date.today().isoformat()
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write('\n')
          # 发布说明里的「安装信息」同步真实指纹（App 内展示的 Release 详情就是它）
          try:
              notes = open('RELEASE_NOTES.md', encoding='utf-8').read()
              # 只改最上面那一节（当前版本）的指纹：历史版本那几节的
              # 大小 / SHA-256 是当时那个包的真实值，全替换就把旧记录改坏了
              #
              # 两种写法都要认：表格行（| 大小 | 856,789 字节（约 836 KB） |）
              # 和早期的列表行（- 大小：856,789 字节）。以前只认后一种，
              # 而文件早就改成表格了 —— 于是指纹一直是上一个包的，白写。
              kb = '%.0f' % (len(data) / 1024.0)
              size_cell = '| 大小 | ' + format(len(data), ',') + ' 字节（约 ' + kb + ' KB） |'
              notes = re.sub(r'\|\s*大小\s*\|[^|\n]*\|', size_cell, notes, count=1)
              notes = re.sub(r'(- 大小：)[\d,]+ 字节',
                             lambda mm: mm.group(1) + format(len(data), ',') + ' 字节',
                             notes, count=1)
              notes = re.sub(r'\|\s*SHA-256\s*\|\s*`?[^`|\n]*`?\s*\|',
                             '| SHA-256 | `' + sha + '` |', notes, count=1)
              notes = re.sub(r'(- SHA-256：`)[0-9a-fA-F]{64}(`)',
                             lambda mm: mm.group(1) + sha + mm.group(2), notes, count=1)
              open('RELEASE_NOTES.md', 'w', encoding='utf-8').write(notes)
          except FileNotFoundError:
              pass
          print('version.json 已更新: version=%s size=%d sha256=%s'
                % (ver, len(data), sha))
          PY
          git config user.name aeroheaven
          git config user.email aeroheaven@users.noreply.github.com
          git add version.json RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "指纹文件已是最新，无需提交"
          else
            git commit -m "发布 ${{ github.ref_name }}：自动同步安装包指纹"
            git push origin HEAD:main
          fi
