# 云端构建：编 Debug / Release APK，并通过 REST API 把产物与构建日志直接写回仓库
# （绕开无法直接下载 Actions 日志/产物的限制）。
name: Build Debug APK (log)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: Buwrt
      REPO: 1
      BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        id: d
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        id: r
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit logs via API
        run: |
          set -e
          for f in build-debug.log build-release.log; do
            [ -f "$f" ] || echo "(empty)" > "$f"
            tail -n 400 "$f" > "tail-$f"
            gh api -X PUT "repos/$OWNER/$REPO/contents/ci/$f" \
              -f message="ci: 构建日志 $f (run ${GITHUB_RUN_NUMBER})" \
              -f branch="$BRANCH" \
              -F content=@"tail-$f" 2>/dev/null \
              || gh api -X PUT "repos/$OWNER/$REPO/contents/ci/$f" \
                   -f message="ci: 构建日志 $f (run ${GITHUB_RUN_NUMBER})" \
                   -f branch="$BRANCH" \
                   -f content="$(base64 -w0 tail-$f)"
          done
          echo "logs committed"

      - name: Commit APKs via API
        run: |
          set -e
          for pair in "debug:app/build/outputs/apk/debug:githup-debug.apk" "release:app/build/outputs/apk/release:githup-release.apk"; do
            VARIANT=$(echo "$pair" | cut -d: -f1)
            DIR=$(echo "$pair" | cut -d: -f2)
            NAME=$(echo "$pair" | cut -d: -f3)
            APK=$(ls "$DIR"/*.apk 2>/dev/null | head -1 || true)
            if [ -z "$APK" ]; then echo "no $VARIANT apk"; continue; fi
            echo "uploading $VARIANT: $APK ($(stat -c%s "$APK") bytes)"
            gh api -X PUT "repos/$OWNER/$REPO/contents/apk/$NAME" \
              -f message="ci: $VARIANT APK (run ${GITHUB_RUN_NUMBER})" \
              -f branch="$BRANCH" \
              -f content="$(base64 -w0 "$APK")"
            sha256sum "$APK" | awk '{print $1}' > "$NAME.sha256"
            gh api -X PUT "repos/$OWNER/$REPO/contents/apk/$NAME.sha256" \
              -f message="ci: $NAME sha256" \
              -f branch="$BRANCH" \
              -f content="$(base64 -w0 "$NAME.sha256")"
          done
          echo "apks committed"

      - name: Upload APK artifact
        if: steps.d.outputs.exit == '0' || steps.r.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: githup-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
